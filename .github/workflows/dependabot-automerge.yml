name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  enable-auto-merge:
    name: Enable Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'nguyentin05/nexus-monitoring-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch metadata from Dependabot PR
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash --subject "$PR_TITLE" --body "Automated patch dependency update." "$PR_URL"

      - name: Request review for minor and major updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          short_type="${UPDATE_TYPE#version-update:semver-}"
          gh pr comment "$PR_URL" --body "Hey @$REPO_OWNER, this PR contains a **$short_type** update (non-patch). Auto-merge was skipped. Please review and merge it manually when the test checks are green."
