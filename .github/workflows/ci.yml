name: Agent CI

on:
  workflow_call:
    inputs:
      allow_format:
        default: true
        required: false
        type: boolean

permissions: {}

jobs:
  format-code:
    name: Format Go code
    if: >-
      inputs.allow_format &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format Go code
        run: gofmt -w cmd internal

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        with:
          commit_message: "style(agent): auto-format Go sources"
          commit_user_name: nexus-cicd-bot
          commit_user_email: ${{ secrets.NEXUS_CICD_BOT_EMAIL }}
          commit_author: nexus-cicd-bot <${{ secrets.NEXUS_CICD_BOT_EMAIL }}>

  lint-code:
    name: Lint Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run go vet
        run: go vet ./...

  lint-dockerfile:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Hadolint Action
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  unit-tests:
    name: Run unit tests
    needs: [lint-code, lint-dockerfile]
    if: >-
      always() &&
      needs.lint-code.result == 'success' &&
      needs.lint-dockerfile.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

  sast:
    name: Static Application Security Testing
    needs: [lint-code, lint-dockerfile]
    if: >-
      always() &&
      needs.lint-code.result == 'success' &&
      needs.lint-dockerfile.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3

  build:
    name: Build container image
    needs: [unit-tests, sast]
    if: >-
      always() &&
      needs.unit-tests.result == 'success' &&
      needs.sast.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build container image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: local/nexus-monitoring-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Export container image
        run: docker save local/nexus-monitoring-agent:${{ github.sha }} | gzip > image-monitoring-agent.tar.gz

      - name: Upload container image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: image-monitoring-agent
          path: image-monitoring-agent.tar.gz
          retention-days: 1

  validate-image:
    name: Validate container image
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      IMAGE: local/nexus-monitoring-agent:${{ github.sha }}
      CONTAINER: nexus-smoke-monitoring-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download container image
        uses: actions/download-artifact@v8.0.1
        with:
          name: image-monitoring-agent
          path: .ci-image

      - name: Load container image
        run: gunzip -c .ci-image/image-monitoring-agent.tar.gz | docker load

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom-monitoring-agent.spdx.json
          artifact-name: sbom-monitoring-agent.spdx.json
          upload-release-assets: false

      - name: Scan container image
        uses: anchore/scan-action@v7.4.0
        with:
          sbom: sbom-monitoring-agent.spdx.json
          fail-build: true
          only-fixed: true
          severity-cutoff: high
          output-format: table

      - name: Run container smoke test
        run: |
          trap 'docker logs "$CONTAINER" || true; docker rm -f "$CONTAINER" || true' EXIT
          docker run --detach --name "$CONTAINER" --publish 127.0.0.1:18080:8080 "$IMAGE"
          for _ in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
